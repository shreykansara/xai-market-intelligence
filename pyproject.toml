[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "market-intelligence"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "sentence-transformers",
    "streamlit",
    "plotly",
    "numpy",
    "pandas",
]

[tool.hatch.build.targets.wheel]
packages = ["src/marketintel"]
