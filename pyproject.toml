[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "market-intelligence"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    # fastembed, not sentence-transformers - see embeddings.py's docstring.
    # sentence-transformers pulls in torch, which alone pushed this process to
    # ~500MB RSS against Render's free-tier 512MB limit; fastembed runs the
    # identical model via onnxruntime with no torch dependency at all.
    "fastembed",
    "fastapi",
    "uvicorn",
    "numpy",
    "pandas",
    "scikit-learn",
    "feedparser",
    "gdeltdoc",
    "openpyxl",
    "python-multipart",
    # Supabase (Postgres + pgvector) driver - was previously appended as a
    # SEPARATE `pip install 'psycopg[binary]'` in Render's build command,
    # which is exactly the fragile, manually-quoted step that produced the
    # `Invalid requirement: 'psycopg[binary]poetry'` deploy failure. Declaring
    # it here means `pip install -e .` alone pulls everything - one install
    # command, nothing left for a dashboard field to mangle.
    "psycopg[binary]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/marketintel"]
